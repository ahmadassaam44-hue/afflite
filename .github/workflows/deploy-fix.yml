name: deploy-fix
on: push
jobs:
  fix:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'deploy-fix')
    steps:
      - uses: actions/checkout@v4
      - run: php -l config.php
      - run: php -l index.php
      - name: FTP upload php+html
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_ROOT: /htdocs
        run: |
          python - <<'PY'
          import ftplib, glob
          host=os.environ['FTP_HOST']; user=os.environ['FTP_USER']; pw=os.environ['FTP_PASS']; root=os.environ.get('FTP_ROOT','/htdocs')
          f=ftplib.FTP(host); f.login(user,pw); f.cwd(root)
          files = glob.glob('*.php') + glob.glob('*.html') + glob.glob('dashboard/*.php')
          print(f"upload {files}")
          for rel in files:
              print(f"STOR {rel}")
              f.storbinary(f'STOR {rel}', open(rel,'rb'))
          f.quit()
          PY
