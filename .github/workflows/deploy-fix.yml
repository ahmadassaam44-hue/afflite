name: deploy-fix
on: push
jobs:
  fix:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'deploy-fix')
    steps:
      - uses: actions/checkout@v4
      - run: php -l config.php
      - name: FTP upload hello
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_ROOT: /htdocs
        run: |
          python - <<'PY'
          import ftplib, os
          host=os.environ['FTP_HOST']; user=os.environ['FTP_USER']; pw=os.environ['FTP_PASS']; root=os.environ.get('FTP_ROOT','/htdocs')
          f=ftplib.FTP(host); f.login(user,pw); f.cwd(root)
          for fn in ['hello.html','test2.php','test.php','config.php','index.php']:
              try:
                  print(f"upload {fn}")
                  f.storbinary(f'STOR {fn}', open(fn,'rb'))
                  print(f"ok {fn}")
              except Exception as e:
                  print(f"fail {fn}: {e}")
          f.quit()
          print("done")
          PY
