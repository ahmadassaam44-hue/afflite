name: deploy-fix
on: push
jobs:
  fix:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'deploy-fix')
    steps:
      - uses: actions/checkout@v4
      - run: php -l config.php
      - run: php -l index.php
      - run: php -l debug.php
      - name: FTP upload all php
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_ROOT: /htdocs
        run: |
          python - <<'PY'
          import ftplib, os, hashlib, glob
          host=os.environ['FTP_HOST']; user=os.environ['FTP_USER']; pw=os.environ['FTP_PASS']; root=os.environ.get('FTP_ROOT','/htdocs')
          f=ftplib.FTP(host, timeout=60)
          f.login(user,pw)
          f.cwd(root)
          files = glob.glob('*.php') + glob.glob('dashboard/*.php')
          print(f"uploading {len(files)} php files")
          for rel in files:
              print(f"STOR {rel}")
              with open(rel,'rb') as fh:
                  f.storbinary(f'STOR {rel}', fh)
              # verify
              import io
              buf=io.BytesIO()
              f.retrbinary(f'RETR {rel}', buf.write)
              print(f"  remote size {len(buf.getvalue())}")
          f.quit()
          print("done")
          PY
