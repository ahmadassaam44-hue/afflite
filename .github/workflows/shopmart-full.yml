name: shopmart-full
on:
  push:
    paths:
      - '.github/workflows/shopmart-full.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests pillow
      - name: run shopmart
        env:
          SHOPMART_USER: ${{ secrets.SHOPMART_USER }}
          SHOPMART_PASS: ${{ secrets.SHOPMART_PASS }}
        run: |
          python updater/update_catalog.py shopmart 2>&1 | tee /tmp/log.txt
          tail -n 80 /tmp/log.txt
          echo "counts:"; cat data/catalog_counts.json | head -n 20
          echo "update:"; cat data/catalog_update.json | python3 -m json.tool | head -n 60
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopmart-data
          path: |
            data/shopmart.json
            data/lite_shopmart.json
            data/catalog_counts.json
            data/catalog_update.json
            data/price_history.json
            data/safqa.json
            data/timehand.json
          if-no-files-found: warn
      - name: commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.bot"
          git add data/shopmart.json data/lite_shopmart.json data/catalog_counts.json data/catalog_update.json data/price_history.json || true
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "shopmart update 233"
          # use gh cli to push via token
          git push origin HEAD:main
