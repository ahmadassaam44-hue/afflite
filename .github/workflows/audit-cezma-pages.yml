# The catalog workflow also dispatches this scan when this file changes on an Arena branch.
# Its run artifact retains the detailed checked/unavailable/error URL report.
name: Audit saved Cezma product pages

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FTP_HOST: ${{ secrets.FTP_HOST }}
  FTP_USER: ${{ secrets.FTP_USER }}
  FTP_PASS: ${{ secrets.FTP_PASS }}
  FTP_ROOT: /htdocs

# Serialize with the catalog updater: both jobs can change/publish the same shards.
concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan every saved product page and publish removals
        id: audit
        run: python updater/audit_cezma_pages.py

      - name: Save unavailable IDs and cleaned catalog shards
        if: always()
        run: |
          git config user.name "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/cezma_unavailable.json data/cezma_shards/*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Remove unavailable Cezma products after page audit [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No catalog availability changes to persist."
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cezma-product-page-audit-${{ github.run_id }}
          path: data/cezma_page_audit_report.json
          if-no-files-found: warn
          retention-days: 30
