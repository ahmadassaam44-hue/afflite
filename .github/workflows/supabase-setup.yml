name: إعداد Supabase (جدول الحسابات + دالة الإيميل)

# يتشغل تلقائياً لما يتعدل ملفات supabase/ على الفرع، أو يدوياً من Actions
on:
  push:
    branches:
      - arena/5c8aefcc-afflite
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-setup.yml'
  workflow_dispatch:
    inputs:
      run_sql:
        description: 'تشغيل كل SQL (profiles + app_docs)'
        type: boolean
        default: true
      deploy_mail:
        description: 'نشر دالة send-mail وتحديث الـ secrets بتاعتها'
        type: boolean
        default: true

permissions:
  contents: read
  statuses: write

concurrency:
  group: supabase-setup
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: hbhuxhphlpgwqynstytw
  SUPABASE_URL: https://hbhuxhphlpgwqynstytw.supabase.co
  # عنوان الموقع اللي بيرجع له رابط استعادة كلمة السر
  SITE_URL: https://wafirinhalk.ct.ws
  # تسجيل الدخول بجوجل (اختياري): لو الاتنين موجودين في GitHub Secrets بيتفعّل في Supabase
  # إعادة تشغيل بعد إضافة secrets جوجل (تعليق فقط)
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  # المفتاح العام (anon) — موجود في الكود أصلاً، مش سر
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhiaHV4aHBobHBnd3F5bnN0eXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4OTA3NTAsImV4cCI6MjA5MjQ2Njc1MH0.THAVZoJvoZYAqDUFCk3JCuRXq2-gPa0gvtRbzrZHkqg

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: التأكد من الـ secrets
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_SHARED_SECRET: ${{ secrets.MAIL_SHARED_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret ناقص: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          echo "توكن Supabase موجود ✅"
          missing=""
          [ -z "$RESEND_API_KEY" ] && missing="$missing RESEND_API_KEY"
          [ -z "$MAIL_FROM" ] && missing="$missing MAIL_FROM"
          [ -z "$MAIL_SHARED_SECRET" ] && missing="$missing MAIL_SHARED_SECRET"
          if [ -n "$missing" ]; then
            echo "::notice::secrets الإيميل ناقصة (هيتخطى نشر الدالة):$missing"
            echo "mail_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "secrets الإيميل موجودة ✅"
            echo "mail_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: تشغيل كل الـ SQL (profiles + app_docs)
        id: sql
        if: ${{ github.event_name == 'push' || inputs.run_sql }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          run_query() {
            jq -Rs '{query: .}' "$1" > "$RUNNER_TEMP/q.json"
            code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST "$api" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/q.json")
            echo "HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              cat "$RUNNER_TEMP/out.json"; echo
              return 1
            fi
          }
          # كل الـ migrations بالترتيب (كلها idempotent: create if not exists / drop+create)
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "migration: $f"
            if ! run_query "$f"; then
              echo "result=fail_sql" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done
          printf '%s\n' "select (to_regclass('public.profiles') is not null and to_regclass('public.app_docs') is not null) as tables_exist;" > "$RUNNER_TEMP/check.sql"
          if ! run_query "$RUNNER_TEMP/check.sql"; then
            echo "result=fail_check" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          exists=$(jq -r '.[0].tables_exist' "$RUNNER_TEMP/out.json")
          echo "tables_exist=$exists"
          echo "result=ok_table_$exists" >> "$GITHUB_OUTPUT"

      - name: إيقاف التسجيل العام في Supabase Auth
        id: auth
        if: ${{ github.event_name == 'push' || inputs.run_sql }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          # إيميل استعادة كلمة السر بيبعت كود (6 أرقام) مش لينك: {{ .Token }} هو الكود
          tpl='<div dir="rtl" style="font-family:Arial,sans-serif;font-size:15px;color:#111"><h2 style="margin:0 0 12px">استعادة كلمة السر</h2><p>الكود بتاعك:</p><p style="font-size:28px;font-weight:bold;letter-spacing:6px;margin:12px 0">{{ .Token }}</p><p>الكود صالح لمدة ساعة. لو ماطلبتش الكود ده تجاهل الرسالة.</p></div>'
          subj='كود استعادة كلمة السر - وفرنهالك'
          # جوجل بيعمل حساب جديد عند أول دخول، ومع تقفيل التسجيل Supabase بيرفضه، فالتقفيل بيتشال لما جوجل يكون مفعّل
          google_on=false
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then google_on=true; fi
          body=$(jq -n --arg site "$SITE_URL" --arg allow "$SITE_URL/reset.php,$SITE_URL/google_callback.php" \
            --arg tpl "$tpl" --arg subj "$subj" --arg gid "$GOOGLE_CLIENT_ID" --arg gsec "$GOOGLE_CLIENT_SECRET" --argjson gon "$google_on" \
            '{disable_signup: (($gon) | not), site_url: $site, uri_allow_list: $allow, mailer_templates_recovery_content: $tpl, mailer_subjects_recovery: $subj}
             + (if $gon then {external_google_enabled: true, external_google_client_id: $gid, external_google_secret: $gsec} else {} end)')
          code=$(curl -sS -o "$RUNNER_TEMP/auth_out.json" -w '%{http_code}' -X PATCH "$api" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body")
          echo "PATCH HTTP $code"
          if [ "$code" != "200" ]; then
            cat "$RUNNER_TEMP/auth_out.json"; echo
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          curl -sS -o "$RUNNER_TEMP/auth_get.json" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api"
          v=$(jq -r '.disable_signup' "$RUNNER_TEMP/auth_get.json")
          site=$(jq -r '.site_url' "$RUNNER_TEMP/auth_get.json")
          echo "disable_signup=$v site_url=$site"
          tpl_get=$(jq -r '.mailer_templates_recovery_content // ""' "$RUNNER_TEMP/auth_get.json")
          echo "recovery_template_has_token=$(printf '%s' "$tpl_get" | grep -cF '{{ .Token }}')"
          want_signup_off=true
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            want_signup_off=false
            gon=$(jq -r '.external_google_enabled' "$RUNNER_TEMP/auth_get.json")
            echo "external_google_enabled=$gon"
            [ "$gon" = "true" ] || { echo "result=fail" >> "$GITHUB_OUTPUT"; exit 1; }
          fi
          if [ "$v" != "$want_signup_off" ] || [ "$site" != "$SITE_URL" ] || ! printf '%s' "$tpl_get" | grep -qF '{{ .Token }}'; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=ok" >> "$GITHUB_OUTPUT"

      - name: نشر دالة send-mail
        id: deploy
        if: ${{ steps.check.outputs.mail_ready == 'true' && (github.event_name == 'push' || inputs.deploy_mail) }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: نشر الدالة وتحديث الـ secrets
        if: ${{ steps.check.outputs.mail_ready == 'true' && (github.event_name == 'push' || inputs.deploy_mail) }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_SHARED_SECRET: ${{ secrets.MAIL_SHARED_SECRET }}
        run: |
          set -euo pipefail
          supabase functions deploy send-mail --project-ref "$SUPABASE_PROJECT_REF"
          umask 077
          envf="$RUNNER_TEMP/fn.env"
          {
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'MAIL_FROM="%s"\n' "$MAIL_FROM"
            printf 'MAIL_SHARED_SECRET=%s\n' "$MAIL_SHARED_SECRET"
          } > "$envf"
          supabase secrets set --env-file "$envf" --project-ref "$SUPABASE_PROJECT_REF"
          rm -f "$envf"
          echo "تم نشر الدالة وتحديث الـ secrets ✅"

      - name: اختبار الدالة
        id: fn
        if: ${{ steps.check.outputs.mail_ready == 'true' && (github.event_name == 'push' || inputs.deploy_mail) }}
        run: |
          # secret غلط عمداً: المتوقع 403 (يعني الدالة شغالة والحماية شغالة)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/send-mail" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "x-mail-secret: wrong-secret-test" \
            -d '{}')
          echo "HTTP $code"
          if [ "$code" != "403" ]; then
            echo "::error::الدالة مش شغالة زي المتوقع (HTTP $code)"
            exit 1
          fi
          echo "الدالة شغالة والحماية شغالة ✅"

      - name: تسجيل النتيجة على الكوميت
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SQL_RESULT: ${{ steps.sql.outputs.result }}
          AUTH_RESULT: ${{ steps.auth.outputs.result }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          MAIL_READY: ${{ steps.check.outputs.mail_ready }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          FN_OUTCOME: ${{ steps.fn.outcome }}
        run: |
          state=success
          case "$SQL_RESULT" in fail*) state=failure ;; esac
          case "$DEPLOY_OUTCOME" in failure) state=failure ;; esac
          case "$FN_OUTCOME" in failure) state=failure ;; esac
          case "$AUTH_OUTCOME" in failure) state=failure ;; esac
          desc="sql=${SQL_RESULT:-skipped} signup_off=${AUTH_RESULT:-skipped} mail_ready=${MAIL_READY:-?} deploy=${DEPLOY_OUTCOME:-skipped} test=${FN_OUTCOME:-skipped}"
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context="supabase-setup" -f description="${desc:0:135}" >/dev/null
          echo "$state: $desc"
