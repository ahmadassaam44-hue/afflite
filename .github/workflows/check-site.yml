name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in "https://wafirinhalk.ct.ws/hello.html?i=1" "https://wafirinhalk.ct.ws/robots.txt?i=1" "https://wafirinhalk.ct.ws/test2.php?i=1"; do
            echo "=== $u ==="
            curl -s -D /tmp/h.txt -o /tmp/b.txt --max-time 20 "$u" || echo "curl fail $?"
            H=$(head -n 5 /tmp/h.txt | tr '\n' ' ' | cut -c1-800)
            echo "::notice::H $u -> $H"
            B=$(head -c 200 /tmp/b.txt | tr '\n' ' ' | cut -c1-800)
            echo "::notice::B $u -> $B size $(wc -c < /tmp/b.txt)"
          done
