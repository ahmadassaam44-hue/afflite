name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test local config load
        run: |
          php -r "require 'config.php'; echo 'local ok:'.implode(',', wf_catalog_plats()).PHP_EOL;" 2>&1 | tee /tmp/local.txt
          cat /tmp/local.txt
      - name: FTP audit
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_ROOT: /htdocs
        run: |
          python - <<'PY' 2>&1 | tee /tmp/ftp.txt
          import ftplib, hashlib, io, os, glob
          host=os.environ['FTP_HOST']; user=os.environ['FTP_USER']; pw=os.environ['FTP_PASS']; root=os.environ.get('FTP_ROOT','/htdocs')
          f=ftplib.FTP(host, timeout=60)
          f.login(user,pw)
          f.cwd(root)
          local=open('config.php','rb').read()
          print(f"local md5 {hashlib.md5(local).hexdigest()} len {len(local)}")
          # run php -r locally output already
          buf=io.BytesIO()
          f.retrbinary('RETR config.php', buf.write)
          remote=buf.getvalue()
          print(f"remote md5 {hashlib.md5(remote).hexdigest()} len {len(remote)} same={hashlib.md5(local).hexdigest()==hashlib.md5(remote).hexdigest()}")
          # check test.php
          try:
              b2=io.BytesIO()
              f.retrbinary('RETR test.php', b2.write)
              print(f"test.php remote {b2.getvalue()[:200]}")
          except Exception as e:
              print(f"test.php fetch fail {e}")
          # list
          lst=f.nlst()
          print(f"ROOT count {len(lst)} sample {lst[:30]}")
          f.quit()
          PY
          cat /tmp/ftp.txt
          cat /tmp/local.txt >> /tmp/ftp.txt
          cp /tmp/ftp.txt ./check_output.txt
          git config user.name "bot"
          git config user.email "bot@bot.bot"
          git add check_output.txt
          git commit -m "check output" || true
          git push origin main || true
