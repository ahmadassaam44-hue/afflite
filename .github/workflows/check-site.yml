name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint all php
        run: |
          set +e
          for f in *.php dashboard/*.php updater/*.php; do
            [ -f "$f" ] || continue
            OUT=$(php -l "$f" 2>&1)
            CODE=$?
            if [ $CODE -ne 0 ]; then
              echo "::error file=$f::${OUT}"
            else
              echo "::notice::$f OK"
            fi
            echo "$f: $OUT"
          done
