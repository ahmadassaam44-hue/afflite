name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in "https://wafirinhalk.ct.ws/robots.txt?i=1" "https://wafirinhalk.ct.ws/assets/style.css?i=1" "https://wafirinhalk.ct.ws/test.php?i=1"; do
            echo "URL $u"
            OUT=$(curl -s -i -L "$u" --max-time 20 2>&1 | head -c 1500 | tr '\n' ' ' | tr '\r' ' ')
            echo "::notice::CURL $u -> ${OUT:0:900}"
          done
