name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: curl static
        run: |
          set +e
          for u in "https://wafirinhalk.ct.ws/robots.txt?i=1" "https://wafirinhalk.ct.ws/assets/style.css?i=1" "https://wafirinhalk.ct.ws/test.php?i=1" "https://wafirinhalk.ct.ws/debug.php?i=1"; do
            echo "=== $u ==="
            curl -s -D /tmp/h.txt -o /tmp/b.txt --max-time 20 -L "$u" || echo "curl fail $?"
            cat /tmp/h.txt
            echo "body head:"
            head -c 500 /tmp/b.txt | od -c | head
            head -n 20 /tmp/b.txt
            echo "---"
          done
          echo "done"
      - name: FTP check htaccess
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_ROOT: /htdocs
        run: |
          python - <<'PY'
          import ftplib, os, io
          host=os.environ['FTP_HOST']; user=os.environ['FTP_USER']; pw=os.environ['FTP_PASS']; root=os.environ.get('FTP_ROOT','/htdocs')
          f=ftplib.FTP(host); f.login(user,pw); f.cwd(root)
          for p in ['.htaccess','php.ini','test.php','debug.php']:
              try:
                  b=io.BytesIO()
                  f.retrbinary(f'RETR {p}', b.write)
                  print(f"=== {p} len {len(b.getvalue())} ===")
                  print(b.getvalue()[:1000].decode(errors='ignore'))
              except Exception as e:
                  print(f"no {p}: {e}")
          f.quit()
          PY
