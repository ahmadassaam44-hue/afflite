name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "test hello.html"
          curl -s -i -L "https://wafirinhalk.ct.ws/hello.html?i=1" --max-time 20 -o /tmp/b.txt -w "CODE:%{http_code}\n" 2>&1 | head -c 500
          cat /tmp/b.txt | head -n 30
          echo "::notice::HELLO:$(head -c 500 /tmp/b.txt | tr '\n' ' ')"
