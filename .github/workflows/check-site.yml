name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: curl debug
        id: curl
        run: |
          echo "curling debug.php"
          set +e
          curl -s -D /tmp/headers.txt -L "https://wafirinhalk.ct.ws/debug.php?i=1" -o /tmp/body.txt --max-time 30
          echo "curl exit $?" >> /tmp/log.txt
          cat /tmp/headers.txt >> /tmp/log.txt
          echo "---BODY---" >> /tmp/log.txt
          head -n 200 /tmp/body.txt >> /tmp/log.txt
          wc -c /tmp/body.txt >> /tmp/log.txt
          # main
          curl -s -D /tmp/headers2.txt -L "https://wafirinhalk.ct.ws/?i=1" -o /tmp/main.txt --max-time 30 || true
          echo "---MAIN HEAD---" >> /tmp/log.txt
          head -n 50 /tmp/main.txt >> /tmp/log.txt
          cat /tmp/log.txt
          echo "log<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/log.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: FTP check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_ROOT: /htdocs
        run: |
          python - <<'PY' >> /tmp/ftp.txt 2>&1 || true
          import ftplib, os, io
          host=os.environ['FTP_HOST']; user=os.environ['FTP_USER']; pw=os.environ['FTP_PASS']; root=os.environ.get('FTP_ROOT','/htdocs')
          try:
              f=ftplib.FTP(host, timeout=30)
              f.login(user,pw)
              f.cwd(root)
              print("LIST")
              for x in f.nlst():
                  print(x)
              for err in ['error_log','error.log','php_error.log','logs/error.log','_error_log']:
                  try:
                      buf=io.BytesIO()
                      f.retrbinary(f'RETR {err}', buf.write)
                      print(f"=== {err} ===")
                      print(buf.getvalue().decode(errors='ignore')[:5000])
                  except Exception as e:
                      print(f"{err} not found: {e}")
              f.quit()
          except Exception as e:
              print("FTP error", e)
          PY
          cat /tmp/ftp.txt
          echo "ftp_log<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/ftp.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        id: ftp
      - name: create issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat /tmp/log.txt /tmp/ftp.txt 2>/dev/null | head -c 8000)
          BODY=$(printf "%s" "$BODY" | jq -Rs .)
          curl -s -X POST -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/issues -d "{\"title\":\"site check $(date -u +%H:%M)\",\"body\":$BODY}" | head
