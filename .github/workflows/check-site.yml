name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: curl debug
        run: |
          curl -s -L "https://wafirinhalk.ct.ws/debug.php?i=1" --max-time 30 -o /tmp/out.txt
          echo "curl done"
          cat /tmp/out.txt | head -n 100
          wc -c /tmp/out.txt
          echo "::notice::OUT:$(head -c 800 /tmp/out.txt | tr '\n' ' ')"
