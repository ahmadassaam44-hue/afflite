name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in "https://wafirinhalk.ct.ws/error.php?c=500&i=1" "https://wafirinhalk.ct.ws/test2.php?i=1" "https://wafirinhalk.ct.ws/hello.html?i=1"; do
            echo "URL $u"
            curl -s -i -L "$u" --max-time 20 -o /tmp/b.txt -w "HTTP_CODE:%{http_code} SIZE:%{size_download}\n" 2>&1
            head -n 30 /tmp/b.txt
            echo "---"
          done
