name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -A "Mozilla/5.0" -s "https://wafirinhalk.ct.ws/test2.php?i=1" -o /tmp/ch.html
          cat /tmp/ch.html
          wc -c /tmp/ch.html
          echo "---"
          curl -A "Mozilla/5.0" -s -D /tmp/h2.txt -o /tmp/b2.txt "https://wafirinhalk.ct.ws/test2.php?i=1"
          cat /tmp/h2.txt
          echo "body:"
          cat /tmp/b2.txt | head -n 50
