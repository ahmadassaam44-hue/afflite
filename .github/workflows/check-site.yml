name: check-site
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://wafirinhalk.ct.ws/test.php?i=1" "https://wafirinhalk.ct.ws/test.php" "https://wafirinhalk.ct.ws/debug.php?i=1" "https://wafirinhalk.ct.ws/?i=1"; do echo "URL $u"; curl -s -i -L "$u" --max-time 20 -o /tmp/o.txt || echo "curl fail $?"; head -n 20 /tmp/o.txt; echo "---"; done
