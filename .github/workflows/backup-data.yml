name: نسخة احتياطية (Supabase)

# بتسحب كل الحسابات (profiles) والملفات التشغيلية (app_docs) من Supabase وتحفظها كـ Artifact في Actions.
# مش بتتحفظ في الريبو (بيانات عملاء). متاحة للتحميل من صفحة الـ run لمدة 30 يوم.
on:
  schedule:
    - cron: '0 1 * * 0'          # كل أحد 3 الصبح بتوقيت القاهرة تقريباً
  workflow_dispatch:
  push:
    branches:
      - arena/5c8aefcc-afflite
    paths:
      - '.github/workflows/backup-data.yml'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: سحب البيانات من Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: hbhuxhphlpgwqynstytw
        run: |
          set -euo pipefail
          mkdir -p backup
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_query() {
            # $1 = الاستعلام، $2 = اسم الملف الناتج
            jq -n --arg q "$1" '{query: $q}' > "$RUNNER_TEMP/q.json"
            code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST "$api" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/q.json")
            echo "$2: HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then cat "$RUNNER_TEMP/out.json"; echo; exit 1; fi
            jq '.[0].rows' "$RUNNER_TEMP/out.json" > "backup/$2"
          }
          run_query "select coalesce(json_agg(t), '[]'::json) as rows from (select * from public.profiles order by email) t" profiles.json
          run_query "select coalesce(json_agg(t), '[]'::json) as rows from (select name, data, updated_at from public.app_docs order by name) t" app_docs.json
          echo "حجم الملفات:"; wc -c backup/*.json
          # تحقق إن الملفات JSON صحيحة وفيها بيانات
          jq -e 'type == "array"' backup/profiles.json >/dev/null
          jq -e 'type == "array"' backup/app_docs.json >/dev/null
          echo "عدد الحسابات: $(jq 'length' backup/profiles.json)"
          echo "عدد الملفات التشغيلية: $(jq 'length' backup/app_docs.json)"

      - name: حفظ النسخة
        uses: actions/upload-artifact@v4
        with:
          name: afflite-backup-${{ github.run_id }}
          path: backup/*.json
          retention-days: 30
