name: تنظيف المنتجات النافدة والمقفولة

on:
  push:
    branches:
      - arena/5a4c72d2-afflite      # فرع العمل بس — main ليه تشغيله المجدول
    paths:
      - 'data/.purge_request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت المتطلبات
        run: pip install --quiet pillow requests

      - name: سحب أسعار/مخزون المنصات + حذف النافد والمقفول + رفع للاستضافة
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_ROOT: /htdocs
          USD_EGP: ${{ vars.USD_EGP || '56' }}
          SAFQA_API_KEY: ${{ secrets.SAFQA_API_KEY }}
          SAFQA_COOKIE: ${{ secrets.SAFQA_COOKIE }}
          VENDOOR_USER: ${{ secrets.VENDOOR_USER }}
          VENDOOR_PASS: ${{ secrets.VENDOOR_PASS }}
          M5ZOON_USER: ${{ secrets.M5ZOON_USER }}
          M5ZOON_PASS: ${{ secrets.M5ZOON_PASS }}
          M5ZOON_COOKIE: ${{ secrets.M5ZOON_COOKIE }}
          ANGAZNY_USER: ${{ secrets.ANGAZNY_USER }}
          ANGAZNY_PASS: ${{ secrets.ANGAZNY_PASS }}
          ANGAZNY_COOKIE: ${{ secrets.ANGAZNY_COOKIE }}
          TIMEHAND_USER: ${{ secrets.TIMEHAND_USER }}
          TIMEHAND_PASS: ${{ secrets.TIMEHAND_PASS }}
          TIMEHAND_COOKIE: ${{ secrets.TIMEHAND_COOKIE }}
          SHOPMART_USER: ${{ secrets.SHOPMART_USER }}
          SHOPMART_PASS: ${{ secrets.SHOPMART_PASS }}
          VISUAL_FEATURES_BUDGET: '0'
          VISUAL_CEZMA_BUDGET: '0'
        run: |
          python updater/update_catalog.py safqa vendoor angazny timehand shopmart m5zoon

      - name: حفظ النتيجة في الفرع
        run: |
          git config user.name  "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json || true
          git diff --cached --quiet && echo "لا تغييرات" || (git commit -m "🧹 حذف المنتجات النافدة/المقفولة $(date -u +'%F %H:%M UTC')" && git push)
