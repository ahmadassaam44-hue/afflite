name: jammaleg-probe
on:
  push:
    paths:
      - '.github/workflows/jammaleg-probe.yml'
      - 'updater/jammaleg.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests beautifulsoup4 lxml pillow
      - name: run jammaleg fetcher
        env:
          JAMMALEG_USER: ${{ secrets.JAMMALEG_USER || vars.JAMMALEG_USER || 'ae782236@gmail.com' }}
          JAMMALEG_PASS: ${{ secrets.JAMMALEG_PASS || vars.JAMMALEG_PASS || 'aA55667788' }}
        run: |
          python updater/jammaleg.py
          echo "--- jammaleg.json count ---"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("data/jammaleg.json")
          if p.exists():
              j=json.loads(p.read_text(encoding='utf-8'))
              print(f"total {len(j)}")
              for row in j[:3]:
                  print(json.dumps(row, ensure_ascii=False)[:2000])
          else:
              print("no file")
          # also lite
          p2=pathlib.Path("data/lite_jammaleg.json")
          if p2.exists():
              j2=json.loads(p2.read_text(encoding='utf-8'))
              print(f"lite total {len(j2)}")
          PY
          ls -lh data/jammaleg.json data/lite_jammaleg.json 2>&1 | head
      - name: commit jammaleg data
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add data/jammaleg.json data/lite_jammaleg.json || true
          git diff --cached --quiet && echo "no changes" || (git commit -m "jammaleg data $(date -u +%H:%M) [skip ci]" && git push)
