name: jammaleg-probe
on:
  push:
    paths:
      - '.github/workflows/jammaleg-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests beautifulsoup4 lxml
      - name: probe scrape products detail
        env:
          JAMMALEG_USER: ${{ secrets.JAMMALEG_USER || vars.JAMMALEG_USER || 'ae782236@gmail.com' }}
          JAMMALEG_PASS: ${{ secrets.JAMMALEG_PASS || vars.JAMMALEG_PASS || 'aA55667788' }}
        run: |
          python - <<'PY'
          import os, requests, json, re, time
          from bs4 import BeautifulSoup
          user=os.environ.get('JAMMALEG_USER')
          pw=os.environ.get('JAMMALEG_PASS')
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 Chrome/124","Accept":"text/html,*/*"})
          out=[]
          def log(*a):
              m=" ".join(str(x) for x in a)
              print(m, flush=True)
              out.append(m)
          # login web
          r=s.get("https://jammaleg.com/affiliate/login", timeout=20)
          m=re.search(r'name="_token" value="([^"]+)"', r.text)
          tok=m.group(1) if m else ""
          log(f"token {tok[:20]}")
          r2=s.post("https://jammaleg.com/login", data={"_token": tok, "email": user, "password": pw}, headers={"Referer":"https://jammaleg.com/affiliate/login","Origin":"https://jammaleg.com"}, timeout=20)
          log(f"login POST {r2.status_code} final {r2.url}")
          # fetch /products page (affiliate product list)
          for url in ["https://jammaleg.com/products","https://jammaleg.com/products?page=1","https://jammaleg.com/sellers"]:
              rr=s.get(url, timeout=20)
              log(f"GET {url} {rr.status_code} len={len(rr.text)}")
              log(rr.text[:12000])
              soup=BeautifulSoup(rr.text,'lxml')
              # find product cards
              ids=re.findall(r'/product/detils/(\d+)', rr.text)
              log(f"ids {ids[:15]}")
              # try to find product card structure
              # look for div with class product
              cards=soup.find_all('div', class_=re.compile(r'product|card'))
              log(f"cards found {len(cards)}")
              if cards:
                  for c in cards[:2]:
                      log(str(c)[:3000])
              # save for later
              if len(rr.text) > 5000 and ids:
                  break
          # fetch product detail and parse
          for pid in ["1790","1789","1784"]:
              rr=s.get(f"https://jammaleg.com/product/detils/{pid}", timeout=20)
              log(f"GET detail {pid} {rr.status_code} len={len(rr.text)}")
              log(rr.text[:15000])
              soup=BeautifulSoup(rr.text,'lxml')
              # price
              price_m=re.search(r'(\d{2,5}(?:\.\d+)?)\s*(?:ج\.م|جنيه|EGP)', rr.text)
              log(f"price_match {price_m.group(0) if price_m else 'none'}")
              # images
              imgs=re.findall(r'https://jammaleg\.com/uploads/products_images/[^\"\'\s<>]+', rr.text)
              log(f"imgs {imgs[:5]}")
              # also try uploads/products_images pattern
              # commission / purchase price
              # look for "سعر الشراء" and "العمولة" or "سعر البيع"
              for term in ["سعر الشراء","سعر البيع","العمولة","السعر","purchase","commission"]:
                  if term in rr.text:
                      idx=rr.text.find(term)
                      log(f"term {term} context: {rr.text[max(0,idx-150):idx+150].replace(chr(10),' ')}")
              # categories
              cats=re.findall(r'category[^\n]{0,100}', rr.text, re.I)
              log(f"cats snippet {cats[:5]}")
          os.makedirs("data", exist_ok=True)
          open("data/_jammaleg_probe5.json","w",encoding="utf-8").write(json.dumps({"log": out}, ensure_ascii=False, indent=2))
          PY
          cat data/_jammaleg_probe5.json | head -c 18000
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add data/_jammaleg_probe5.json || true
          git diff --cached --quiet && echo "no" || (git commit -m "probe5 $(date -u +%H:%M)" && git push)
