name: lint
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint config
        run: |
          echo "=== config ===" > /tmp/lint.txt
          php -l config.php >> /tmp/lint.txt 2>&1; echo "EXIT:$?" >> /tmp/lint.txt
          echo "=== index ===" >> /tmp/lint.txt
          php -l index.php >> /tmp/lint.txt 2>&1; echo "EXIT2:$?" >> /tmp/lint.txt
          cat /tmp/lint.txt
          # show error lines explicitly
          php -l config.php 2>&1 | od -c | head
          php -l config.php 2>&1 || true
          # also try to output via annotation
          MSG=$(php -l config.php 2>&1 | head -c 2000)
          echo "::error::$MSG"
