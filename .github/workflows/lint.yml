name: lint
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint config
        run: |
          echo "=== config ===" > /tmp/lint.txt
          php -l config.php >> /tmp/lint.txt 2>&1; echo "EXIT:$?" >> /tmp/lint.txt
          echo "=== index ===" >> /tmp/lint.txt
          php -l index.php >> /tmp/lint.txt 2>&1; echo "EXIT2:$?" >> /tmp/lint.txt
          cat /tmp/lint.txt
      - name: create issue with lint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat /tmp/lint.txt | head -c 5000)
          BODY=$(printf "%s" "$BODY" | jq -Rs .)
          curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/issues -d "{\"title\":\"lint $(date)\",\"body\":$BODY}" | head
