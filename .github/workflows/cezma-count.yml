name: Cezma 2026 product count

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/c75b8bff-afflite'
    paths:
      - 'cezma_count.py'
      - 'cezma_count_api.py'
      - 'cezma_probe.py'
      - 'cezma_final.py'
      - 'cezma_scrape2026.py'
      - 'cezma_cat_probe.py'
      - 'cezma_categories2026.py'
      - 'cezma_fashion_sub.py'
      - 'cezma_next.py'
      - 'cezma_combined.py'
      - 'cezma_2025plus.py'
      - 'cezma_cat_probe2.py'
      - '.github/workflows/cezma-count.yml'

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count Cezma 2026 products
        run: python3 cezma_filter.py
      - name: Commit result back to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in cezma_result.json cezma_2026_products.csv cezma_result_api.json cezma_2026_products_api.csv cezma_api_log.txt cezma_probe_log.txt cezma_final_log.txt cezma_result_final.json cezma_2026_full.csv cezma_scrape_summary.json cezma_scrape_log.txt cezma_cat_probe_log.txt cezma_categories_log.txt cezma_categories_2026.json cezma_categories_2026.csv cezma_cat_probe2_log.txt cezma_fashion_sub_log.txt cezma_fashion_sub_2026.json cezma_fashion_sub_2026.csv cezma_next_log.txt cezma_next_summary.json cezma_home_garden_sub_2026.csv cezma_women_clothing_2026.csv cezma_combined_log.txt cezma_combined_2026.json cezma_combined_2026.csv cezma_2025plus_log.txt cezma_2025plus_result.json cezma_scrape_both_log.txt cezma_scrape_both_summary.json cezma_both_2025_2026_full.csv cezma_filter_probe_log.txt cezma_filter_probe.json cezma_filtered_2025_2026.csv cezma_filter_summary.json cezma_filter_log.txt; do [ -f "$f" ] && git add "$f" || true; done
          git diff --cached --quiet || git commit -m "Cezma 2026 count result [skip ci]"
          git push origin HEAD:arena/c75b8bff-afflite || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cezma-2026
          path: |
            cezma_result.json
            cezma_2026_products.csv
            cezma_result_api.json
            cezma_api_log.txt
          if-no-files-found: ignore
